<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="robots" content="noindex" />
    <title>Pour toi</title>
    <script>
      // affiche toute erreur à l'écran (débogage iPhone)
      window.__err = function (m) {
        var d = document.getElementById('__err') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: '__err' }));
        d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;color:#f88;font:11px monospace;white-space:pre-wrap;background:#000c;padding:6px';
        d.textContent += m + '\n';
      };
      addEventListener('error', function (e) { window.__err((e.message || e) + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
      addEventListener('unhandledrejection', function (e) { window.__err('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="ui">
      <div id="labels"></div>
      <div id="story"></div>
      <div id="card">
        <div class="card-day"></div>
        <div class="card-date"></div>
        <div class="card-line"></div>
      </div>
      <div id="hint"></div>
      <div id="loader"><div><i></i></div><span>0 %</span></div>

      <div id="bubbles"></div>
      <div id="hotel"></div>
      <div id="agenda"></div>
      <div id="recap"></div>

      <div id="reveal">
        <div class="rv-title" data-text="THUNDERDOME"></div>
        <div class="rv-date"></div>
        <div class="rv-places"></div>
        <div class="rv-nous"></div>
      </div>

      <div id="end">
        <div class="end-msg"></div>
        <button class="end-replay"></button>
      </div>
    </div>

    <button id="mute" aria-label="Couper le son">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none" />
        <path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
        <path class="x" d="m16 9 6 6m0-6-6 6" />
      </svg>
    </button>
    <div id="portal"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="flash"></div>
    <div id="fade"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
